# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█

# See https://wiki.hyprland.org/Configuring/Window-Rules/

# '$&' is a hyde specific shorthand for "override" \\ analogous to a reference
# This symbol indicates that the following values will override the default configuration
$&=override

# No transparency for VLC and VS Code
windowrule = match:class ^(vlc)$, opacity 1.0 $& 1.0 $& 1
windowrule = match:class ^([Cc]ode)$, opacity 1.0 $& 1.0 $& 1
windowrule = match:class ^(code-oss)$, opacity 1.0 $& 1.0 $& 1
windowrule = match:class ^(code-url-handler)$, opacity 1.0 $& 1.0 $& 1
windowrule = match:class ^(code-insiders-url-handler)$, opacity 1.0 $& 1.0 $& 1

# windowrulev2 = opacity 0.90 $& 0.90 $& 1,class:^(firefox)$
# windowrulev2 = opacity 0.90 $& 0.90 $& 1,class:^(Brave-browser)$
# windowrulev2 = opacity 0.80 $& 0.80 $& 1,class:^(code-oss)$
# windowrulev2 = opacity 0.80 $& 0.80 $& 1,class:^([Cc]ode)$
# windowrulev2 = opacity 0.80 $& 0.80 $& 1,class:^(code-url-handler)$
# windowrulev2 = opacity 0.80 $& 0.80 $& 1,class:^(code-insiders-url-handler)$
windowrule = match:class ^(kitty)$, opacity 0.80 $& 0.80 $& 1
windowrule = match:class ^(org.kde.dolphin)$, opacity 0.80 $& 0.80 $& 1
# windowrulev2 = opacity 0.80 $& 0.80 $& 1,class:^(org.kde.ark)$
# windowrulev2 = opacity 0.80 $& 0.80 $& 1,class:^(nwg-look)$
# windowrulev2 = opacity 0.80 $& 0.80 $& 1,class:^(qt5ct)$
# windowrulev2 = opacity 0.80 $& 0.80 $& 1,class:^(qt6ct)$
windowrule = match:class ^(kvantummanager)$, opacity 0.80 $& 0.80 $& 1
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, opacity 0.80 $& 0.70 $& 1
windowrule = match:class ^(blueman-manager)$, opacity 0.80 $& 0.70 $& 1
windowrule = match:class ^(nm-applet)$, opacity 0.80 $& 0.70 $& 1
windowrule = match:class ^(nm-connection-editor)$, opacity 0.80 $& 0.70 $& 1
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, opacity 0.80 $& 0.70 $& 1
windowrule = match:class ^(polkit-gnome-authentication-agent-1)$, opacity 0.80 $& 0.70 $& 1
windowrule = match:class ^(org.freedesktop.impl.portal.desktop.gtk)$, opacity 0.80 $& 0.70 $& 1
windowrule = match:class ^(org.freedesktop.impl.portal.desktop.hyprland)$, opacity 0.80 $& 0.70 $& 1
windowrule = match:class ^([Ss]team)$, opacity 0.70 $& 0.70 $& 1
windowrule = match:class ^(steamwebhelper)$, opacity 0.70 $& 0.70 $& 1
windowrule = match:class ^([Ss]potify)$, opacity 0.70 $& 0.70 $& 1
windowrule = match:initial_title ^(Spotify Free)$, opacity 0.70 $& 0.70 $& 1
windowrule = match:initial_title ^(Spotify Premium)$, opacity 0.70 $& 0.70 $& 1

# windowrulev2 = opacity 0.90 0.90,class:^(com.github.rafostar.Clapper)$ # Clapper-Gtk
# windowrulev2 = opacity 0.80 0.80,class:^(com.github.tchx84.Flatseal)$ # Flatseal-Gtk
# windowrulev2 = opacity 0.80 0.80,class:^(hu.kramo.Cartridges)$ # Cartridges-Gtk
# windowrulev2 = opacity 0.80 0.80,class:^(com.obsproject.Studio)$ # Obs-Qt
# windowrulev2 = opacity 0.80 0.80,class:^(gnome-boxes)$ # Boxes-Gtk
# windowrulev2 = opacity 0.80 0.80,class:^(vesktop)$ # Vesktop
# # windowrulev2 = opacity 0.80 0.80,class:^(discord)$ # Discord-Electron
# windowrulev2 = opacity 0.80 0.80,class:^(WebCord)$ # WebCord-Electron
