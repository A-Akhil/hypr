# windowrulev2 = float,class:^(org.kde.dolphin)$,title:^(Progress Dialog — Dolphin)$
# windowrulev2 = float,class:^(org.kde.dolphin)$,title:^(Copying — Dolphin)$
# # windowrulev2 = float,title:^(About Mozilla Firefox)$
# windowrulev2 = float,class:^(firefox)$,title:^(Picture-in-Picture)$
windowrule = match:class ^(firefox)$, match:title ^(Library)$, float on
windowrule = match:class ^(kitty)$, match:title ^(top)$, float on
windowrule = match:class ^(kitty)$, match:title ^(btop)$, float on
windowrule = match:class ^(kitty)$, match:title ^(htop)$, float on
# windowrulev2 = float,class:^(vlc)$/
# windowrulev2 = float,class:^(kvantummanager)$
# windowrulev2 = float,class:^(qt5ct)$
# windowrulev2 = float,class:^(qt6ct)$
# windowrulev2 = float,class:^(nwg-look)$
# windowrulev2 = float,class:^(org.kde.ark)$
# windowrulev2 = float,class:^(org.pulseaudio.pavucontrol)$
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-applet)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float on

# windowrulev2 = float,class:^(Signal)$ # Signal-Gtk
# windowrulev2 = float,class:^(com.github.rafostar.Clapper)$ # Clapper-Gtk
# windowrulev2 = float,class:^(app.drey.Warp)$ # Warp-Gtk
# windowrulev2 = float,class:^(net.davidotek.pupgui2)$ # ProtonUp-Qt
# windowrulev2 = float,class:^(yad)$ # Protontricks-Gtk
# windowrulev2 = float,class:^(eog)$ # Imageviewer-Gtk
# windowrulev2 = float,class:^(io.github.alainm23.planify)$ # planify-Gtk
# windowrulev2 = float,class:^(io.gitlab.theevilskeleton.Upscaler)$ # Upscaler-Gtk
# windowrulev2 = float,class:^(com.github.unrud.VideoDownloader)$ # VideoDownloader-Gkk
# windowrulev2 = float,class:^(io.gitlab.adhami3310.Impression)$ # Impression-Gtk
# windowrulev2 = float,class:^(io.missioncenter.MissionCenter)$ # MissionCenter-Gtk

# common modals
windowrule = match:initial_title ^(Open File)$, float on
windowrule = match:title ^(Choose Files)$, float on
windowrule = match:title ^(Save As)$, float on
windowrule = match:title ^(Confirm to replace files)$, float on
windowrule = match:title ^(File Operation Progress)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on

# █░░ ▄▀█ █▄█ █▀▀ █▀█   █▀█ █░█ █░░ █▀▀ █▀
# █▄▄ █▀█ ░█░ ██▄ █▀▄   █▀▄ █▄█ █▄▄ ██▄ ▄█

layerrule = blur on, match:namespace ^(rofi)$
layerrule = ignore_alpha 0, match:namespace ^(rofi)$
layerrule = blur on, match:namespace ^(notifications)$
layerrule = ignore_alpha 0, match:namespace ^(notifications)$
layerrule = blur on, match:namespace ^(swaync-notification-window)$
layerrule = ignore_alpha 0, match:namespace ^(swaync-notification-window)$
layerrule = blur on, match:namespace ^(swaync-control-center)$
layerrule = ignore_alpha 0, match:namespace ^(swaync-control-center)$
layerrule = blur on, match:namespace ^(logout_dialog)$
